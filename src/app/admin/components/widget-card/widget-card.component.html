<mat-card [class]="'widget-card widget-card--' + (widget.color || 'default')">
  <mat-card-header *ngIf="widget.title">
    <mat-card-title>{{ widget.title }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ widget.content }}</p>
  </mat-card-content>
  <mat-card-actions *ngIf="widget.actions && widget.actions.length > 0">
    <button
      *ngFor="let action of widget.actions"
      mat-button
      [color]="widget.color || 'primary'"
      (click)="handleAction(action.action)"
    >
      {{ action.label }}
    </button>
  </mat-card-actions>
</mat-card>
