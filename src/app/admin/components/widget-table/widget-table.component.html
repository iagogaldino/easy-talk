<div class="widget-table">
  <h3 *ngIf="widget.title" class="widget-table__title">{{ widget.title }}</h3>
  <table class="widget-table__table">
    <thead>
      <tr>
        <th *ngFor="let column of displayedColumns">{{ column }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of dataSource">
        <td *ngFor="let column of displayedColumns">{{ row[column] }}</td>
      </tr>
    </tbody>
  </table>
</div>
