<div class="widget-sales-chart">
  <h3 *ngIf="widget.title" class="widget-sales-chart__title">{{ widget.title }}</h3>
  <div class="widget-sales-chart__container">
    <canvas 
      baseChart
      [data]="chartData"
      [options]="chartOptions"
      [type]="chartType">
    </canvas>
  </div>
</div>
