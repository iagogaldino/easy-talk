<div class="widget-alerts-list">
  <div class="widget-alerts-list__header">
    <h3 class="widget-alerts-list__title">{{ widget.title || 'Alertas' }}</h3>
  </div>
  <div class="widget-alerts-list__content">
    <div class="alert-item" *ngFor="let alert of widget.data" [class.alert-read]="alert.read">
      <div class="alert-item__icon" [class]="'alert-icon alert-icon-' + alert.type">
        {{ getTypeIcon(alert.type) }}
      </div>
      <div class="alert-item__content">
        <div class="alert-item__header">
          <h4 class="alert-item__title">{{ alert.title }}</h4>
          <span *ngIf="!alert.read" class="alert-item__unread-badge">Novo</span>
        </div>
        <p class="alert-item__message">{{ alert.message }}</p>
        <div class="alert-item__meta">
          <span class="alert-item__timestamp">{{ formatDate(alert.timestamp) }}</span>
          <a *ngIf="alert.actionUrl" [href]="alert.actionUrl" class="alert-item__action">Ver detalhes →</a>
        </div>
      </div>
    </div>
  </div>
</div>
