<aside class="contact-profile" [class.contact-profile--open]="open">
  <header class="contact-profile__header">
    <button mat-icon-button aria-label="Voltar" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <section class="contact-profile__body" *ngIf="conversation as convo">
    <div class="contact-profile__avatar-wrapper">
      <ng-container *ngIf="avatarUrl; else initials">
        <img
          [src]="avatarUrl"
          [alt]="convo.contactName"
          class="contact-profile__avatar"
          (error)="onImageError($event)"
          (load)="onImageLoad($event)"
        />
      </ng-container>
      <ng-template #initials>
        <div
          class="contact-profile__avatar contact-profile__avatar--fallback"
          [style.background-color]="convo.avatarColor"
        >
          {{ convo.contactName[0] }}
        </div>
      </ng-template>
    </div>

    <div class="contact-profile__identity">
      <h3>{{ convo.profile?.displayName ?? convo.contactName }}</h3>
      <p class="contact-profile__nickname" *ngIf="convo.profile?.nickname">{{ convo.profile?.nickname }}</p>
    </div>

    <!-- Estado de chamada -->
    <div 
      class="contact-profile__call-status" 
      [class.contact-profile__call-status--connected]="callState === 'connected'"
      *ngIf="callState !== 'idle'"
    >
      <div
        class="contact-profile__call-pulse"
        [class.contact-profile__call-pulse--connected]="callState === 'connected'"
      >
        <mat-icon>{{ callIcon }}</mat-icon>
      </div>
      <div class="contact-profile__call-info">
        <span class="contact-profile__call-status-title">{{ callStatusMessage }}</span>
        <p class="contact-profile__call-description">{{ callDescription }}</p>
        <div *ngIf="callState === 'connected'" class="contact-profile__call-timer">
          {{ callTimer }}
        </div>
      </div>
    </div>

    <div class="contact-profile__actions">
      <button
        mat-stroked-button
        [color]="callState === 'connected' ? 'warn' : callState === 'dialing' ? 'warn' : 'primary'"
        (click)="handleVoiceCall()"
        [disabled]="!conversation"
      >
        <mat-icon>{{ getCallButtonIcon() }}</mat-icon>
        {{ getCallButtonText() }}
      </button>
    </div>
  </section>
</aside>
