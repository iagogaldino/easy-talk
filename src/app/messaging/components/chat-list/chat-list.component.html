<div class="chat-list__scroll-container">
  <div class="chat-list__search">
    <mat-form-field appearance="outline" class="chat-list__search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        type="search"
        placeholder="Pesquisar ou começar uma nova conversa"
        autocomplete="off"
      />
      <button mat-icon-button matSuffix aria-label="Filtro" disabled>
        <mat-icon>tune</mat-icon>
      </button>
    </mat-form-field>
  </div>

  <mat-nav-list>
    <a
      mat-list-item
      *ngFor="let conversation of conversations; trackBy: trackByConversationId"
      (click)="handleSelection(conversation.id)"
      (contextmenu)="onContextMenu($event, conversation.id)"
      [class.chat-list__item--active]="conversation.id === selectedConversationId"
      [class.chat-list__item--unread]="conversation.unreadCount && conversation.unreadCount > 0"
    >
      <div matListItemAvatar class="chat-list__avatar-wrapper">
        <img
          *ngIf="conversation.avatarUrl || conversation.profile?.avatarUrl; else initials"
          [src]="conversation.avatarUrl || conversation.profile?.avatarUrl"
          [alt]="conversation.contactName"
          class="chat-list__avatar-image"
        />
        <ng-template #initials>
          <div class="chat-list__avatar" [style.background-color]="conversation.avatarColor">
            {{ conversation.contactName[0] }}
          </div>
        </ng-template>
      </div>
      <div matListItemTitle>
        {{ conversation.contactName }}
      </div>
      <div matListItemLine class="chat-list__preview">
        {{ conversation.lastMessagePreview }}
      </div>
      <div matListItemMeta class="chat-list__meta">
        <span class="chat-list__time">{{ conversation.lastMessageTime | date: 'shortTime' }}</span>
        <span *ngIf="conversation.unreadCount" class="chat-list__badge">{{ conversation.unreadCount }}</span>
      </div>
    </a>
  </mat-nav-list>

  <button 
    mat-button 
    [matMenuTriggerFor]="contextMenu" 
    #contextMenuTrigger="matMenuTrigger"
    #contextMenuButton
    style="position: fixed; opacity: 0; pointer-events: none; width: 1px; height: 1px; z-index: 1000;"
    aria-hidden="true"
    tabindex="-1"
  ></button>

  <mat-menu #contextMenu="matMenu" (closed)="contextMenuConversationId = null">
    <button mat-menu-item (click)="openTransferDialog(); $event.stopPropagation()">
      <mat-icon>swap_horiz</mat-icon>
      <span>Transferir Atendimento</span>
    </button>
  </mat-menu>
</div>
