<div mat-dialog-content class="settings-dialog">
  <div class="settings-dialog__header">
    <h2 class="settings-dialog__title">Configurações</h2>
  </div>

  <div class="settings-dialog__list">
    <button
      mat-button
      *ngFor="let option of settingsOptions"
      (click)="handleOptionClick(option)"
      class="settings-dialog__item"
      [class.settings-dialog__item--danger]="option.danger"
    >
      <mat-icon>{{ option.icon }}</mat-icon>
      <span>{{ option.label }}</span>
    </button>
  </div>

  <mat-divider></mat-divider>

  <div class="settings-dialog__actions">
    <button mat-button class="settings-dialog__logout" (click)="handleLogout()">
      <mat-icon>logout</mat-icon>
      <span>Sair</span>
    </button>
  </div>
</div>
