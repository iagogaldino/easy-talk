<div class="login-page">
  <div class="login-page__container">
    <div class="login-page__header">
      <div class="login-page__logo">
        <mat-icon class="login-page__logo-icon">chat</mat-icon>
        <h1 class="login-page__title">EasyTalk</h1>
      </div>
      <p class="login-page__subtitle">Entre para continuar</p>
    </div>

    <form class="login-page__form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="login-page__field">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>email</mat-icon>
        <input
          matInput
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          required
          [disabled]="isLoading"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="login-page__field">
        <mat-label>Senha</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input
          matInput
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="Digite sua senha"
          required
          [disabled]="isLoading"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="'Mostrar senha'"
          [attr.aria-pressed]="showPassword"
          [disabled]="isLoading"
        >
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <div class="login-page__error" *ngIf="error">
        <mat-icon>error_outline</mat-icon>
        <span>{{ error }}</span>
      </div>

      <button
        mat-flat-button
        type="submit"
        class="login-page__submit"
        [disabled]="isLoading || !email || !password"
      >
        <mat-icon *ngIf="!isLoading">login</mat-icon>
        <mat-spinner *ngIf="isLoading" diameter="20" class="login-page__spinner"></mat-spinner>
        <span>{{ isLoading ? 'Entrando...' : 'Entrar' }}</span>
      </button>
    </form>

    <div class="login-page__footer">
      <p class="login-page__footer-text">
        Esqueceu sua senha?
        <a href="#" class="login-page__link">Recuperar senha</a>
      </p>
    </div>
  </div>
</div>
